name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm i -g pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @glp1/shared build

      - name: Unit tests — shared
        run: pnpm --filter @glp1/shared test

      - name: Unit tests — api
        run: pnpm --filter @glp1/api test:unit

      - name: Unit tests — web
        run: pnpm --filter @glp1/web test:unit

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: glp1
          POSTGRES_PASSWORD: glp1pass
          POSTGRES_DB: glp1db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm i -g pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @glp1/shared build

      - name: Prisma generate + migrate
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://glp1:glp1pass@localhost:5432/glp1db

      - name: Build API
        run: pnpm --filter @glp1/api build

      - name: Start API
        run: pnpm --filter @glp1/api start:prod &
        env:
          DATABASE_URL: postgresql://glp1:glp1pass@localhost:5432/glp1db
          PORT: 3001

      - name: Build web
        run: pnpm --filter @glp1/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

      - name: Start web
        run: pnpm --filter @glp1/web start &

      - name: Install Playwright browsers
        run: pnpm --filter @glp1/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @glp1/web test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
