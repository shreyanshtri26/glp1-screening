services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: glp1
      POSTGRES_PASSWORD: glp1pass
      POSTGRES_DB: glp1db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glp1 -d glp1db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
